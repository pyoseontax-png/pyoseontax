<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>세금 자가진단 | 독종 세무사 전민우</title>
<meta name="description" content="우리 회사 세금 어디서 새는지 3분 자가진단. 12문항 체크만 하면 판정까지.">
<meta property="og:title" content="우리 회사 세금, 어디서 새고 있나">
<meta property="og:description" content="12문항 체크. 3분이면 끝. 세무 지식 없어도 됩니다.">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
<style>
  :root{
    --paper:#FCFBF9; --paper-band:#EFECE6;
    --ink:#16181B; --ink-soft:#4A4E54; --muted:#7A7E85;
    --rule:#D6D3CC; --rule-hard:#B4B0A7;
    --seal:#B01B2E; --seal-tint:#FAF0EF;
  }
  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{
    margin:0; background:#E8E6E1; color:var(--ink);
    font-family:'Pretendard Variable',Pretendard,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
    font-size:16px; line-height:1.7; word-break:keep-all;
    padding:32px 16px 64px;
  }
  .sheet{
    max-width:620px; margin:0 auto; background:var(--paper);
    border:1px solid var(--rule-hard);
    box-shadow:0 1px 0 rgba(0,0,0,.04), 0 18px 48px -24px rgba(0,0,0,.28);
    padding:52px 48px 44px;
  }
  .docmeta{
    display:flex; justify-content:space-between; align-items:baseline; gap:16px;
    font-family:'JetBrains Mono',monospace; font-size:11px;
    letter-spacing:.14em; color:var(--muted); text-transform:uppercase;
    border-bottom:1px solid var(--rule); padding-bottom:10px;
  }
  h1{
    font-family:'Gowun Batang',serif; font-weight:700; text-align:center;
    margin:38px 0 0; font-size:clamp(27px,5.4vw,38px);
    letter-spacing:-.01em; line-height:1.34;
  }
  h1 .em{color:var(--seal); box-shadow:inset 0 -.42em 0 var(--seal-tint);}
  .sub{
    text-align:center; margin:14px auto 0; max-width:40ch;
    color:var(--ink-soft); font-size:15px;
  }
  .pick{
    margin:38px 0 0; border-top:1px solid var(--rule);
  }
  .pick-h{
    font-family:'Gowun Batang',serif; font-size:14px;
    letter-spacing:.42em; text-indent:.42em; text-align:center;
    color:var(--ink-soft); margin:22px 0 18px;
  }
  a.card{
    display:grid; grid-template-columns:1fr auto; align-items:center;
    gap:10px 16px; text-decoration:none; color:inherit;
    border:1px solid var(--rule-hard); background:#fff;
    padding:22px 24px; margin-bottom:14px;
    transition:border-color .16s ease, transform .16s ease, box-shadow .16s ease;
  }
  a.card:hover{
    border-color:var(--seal);
    transform:translateY(-1px);
    box-shadow:0 6px 18px -10px rgba(0,0,0,.3);
  }
  a.card:focus-visible{outline:2px solid var(--seal); outline-offset:2px;}
  .card-t{
    font-family:'Gowun Batang',serif; font-weight:700;
    font-size:21px; margin:0;
  }
  .card-d{
    grid-column:1/2; margin:0; font-size:14px; color:var(--muted); line-height:1.6;
  }
  .card-go{
    grid-row:1/3; font-family:'JetBrains Mono',monospace;
    font-size:22px; color:var(--seal); font-weight:700;
  }
  .note{
    margin:26px 0 0; background:var(--paper-band);
    border-left:3px solid var(--ink); padding:13px 17px;
    font-size:14px; color:var(--ink-soft);
  }
  .sig{
    margin-top:34px; padding-top:20px; border-top:1px solid var(--rule);
    display:flex; justify-content:space-between; align-items:flex-end;
    gap:18px; flex-wrap:wrap;
  }
  .sig-name{font-family:'Gowun Batang',serif; font-size:16px; font-weight:700; margin:0;}
  .sig-name span{
    display:block; font-family:'Pretendard Variable',Pretendard,sans-serif;
    font-size:12.5px; font-weight:400; color:var(--muted); margin-top:5px;
  }
  .seal{
    width:66px;height:66px;border:2px solid var(--seal);border-radius:50%;
    display:grid;place-content:center;text-align:center;color:var(--seal);
    font-family:'Gowun Batang',serif;font-weight:700;font-size:13px;
    line-height:1.3;opacity:.82;transform:rotate(-7deg);flex:none;
  }
  @media (max-width:640px){
    body{padding:14px 10px 48px;}
    .sheet{padding:32px 22px 34px;}
    a.card{padding:19px 18px;}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none !important;}}
</style>
</head>
<body>
<main class="sheet">
  <div class="docmeta">
    <span>독종세무사 · 세무진단</span>
    <span>TAX-CHECK-12</span>
  </div>

  <h1>우리 회사 세금,<br><span class="em">어디서 새고 있나</span></h1>
  <p class="sub">12문항 체크. 3분이면 끝납니다.<br>세무 지식 없어도 됩니다.</p>

  <div class="pick">
    <p class="pick-h">구 분 선 택</p>

    <a class="card" href="corp.html">
      <p class="card-t">법인</p>
      <span class="card-go">→</span>
      <p class="card-d">주식회사·유한회사 등 법인 대표님</p>
    </a>

    <a class="card" href="solo.html">
      <p class="card-t">개인사업자 · 프리랜서</p>
      <span class="card-go">→</span>
      <p class="card-d">개인사업자, 프리랜서, 온라인 셀러, 크리에이터</p>
    </a>
  </div>

  <p class="note">
    체크가 끝나면 <b>결과를 바로 보내는 버튼</b>이 나옵니다. 번호를 따로 적을 필요 없습니다.
  </p>

  <div class="sig">
    <p class="sig-name">독종 세무사 전민우
      <span>국가기관과 싸워 이긴 세무사 · 사건번호 2023-30621<br><a href="https://pyoseontax.com" style="color:#7A7E85;">세무회계 표선</a> · 역삼역 2번 출구 도보 5분</span>
    </p>
    <div class="seal">독종<br>세무사</div>
  </div>
</main>
</body>
</html>
