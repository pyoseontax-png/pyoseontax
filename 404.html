/* =========================================================
   세무회계 표선 — pyoseontax.com
   Brand tokens: 로고/명함에서 추출
   ========================================================= */

:root{
  --navy:        #011F44;
  --navy-deep:   #01152E;
  --navy-line:   #16355C;
  --gold:        #A47E39;
  --gold-bright: #C9A464;
  --gold-pale:   #E4D3AE;
  --paper:       #FAF6ED;
  --paper-2:     #F2EBDD;
  --ink:         #1C1E22;
  --ink-mute:    #5E646F;
  --white:       #FFFFFF;

  --display: 'Gowun Batang', 'Nanum Myeongjo', serif;
  --body: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont,
          'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;

  --wrap: 1180px;
  --hdr: 92px;
  --ease: cubic-bezier(.22,.61,.36,1);
}

/* ---------- reset ---------- */
*,*::before,*::after{ box-sizing:border-box; }
html{ scroll-behavior:smooth; -webkit-text-size-adjust:100%; }
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:var(--body); font-size:16px; line-height:1.75;
  letter-spacing:-.01em; word-break:keep-all; overflow-wrap:break-word;
  -webkit-font-smoothing:antialiased;
}
img{ max-width:100%; height:auto; display:block; }
a{ color:inherit; text-decoration:none; }
h1,h2,h3{ margin:0; font-family:var(--display); font-weight:700; line-height:1.32; letter-spacing:-.02em; }
p{ margin:0; }
ul,ol,dl,dd{ margin:0; padding:0; list-style:none; }
button{ font:inherit; }
.sr{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }
.skip{
  position:absolute; left:-9999px; top:0; z-index:200;
  background:var(--navy); color:var(--paper); padding:12px 20px;
}
.skip:focus{ left:0; }
:focus-visible{ outline:2px solid var(--gold-bright); outline-offset:3px; }

.wrap{ width:100%; max-width:var(--wrap); margin:0 auto; padding:0 24px; }

/* 로고의 골드 마름모 — 사이트 전역 기호 */
.dia{
  display:inline-block; width:18px; height:6px; margin-right:10px;
  background:var(--gold); vertical-align:middle;
  clip-path:polygon(0 50%, 50% 18%, 100% 50%, 50% 82%);
}

/* =========================================================
   버튼
   ========================================================= */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  padding:16px 30px; font-size:15px; font-weight:600; letter-spacing:-.01em;
  border:1px solid transparent; border-radius:2px; cursor:pointer;
  transition:background .25s var(--ease), color .25s var(--ease),
             border-color .25s var(--ease), transform .25s var(--ease);
}
.btn:hover{ transform:translateY(-2px); }
.btn-gold{ background:var(--gold); color:#fff; }
.btn-gold:hover{ background:#B78D42; }
.btn-navy{ background:var(--navy); color:var(--paper); }
.btn-navy:hover{ background:#052B5A; }
.btn-ghost{ border-color:rgba(228,211,174,.45); color:var(--paper); }
.btn-ghost:hover{ border-color:var(--gold-bright); background:rgba(164,126,57,.14); }
.btn-outline{ border-color:rgba(1,31,68,.28); color:var(--navy); }
.btn-outline:hover{ border-color:var(--gold); color:var(--gold); }
.btn-block{ width:100%; }
.btn-sub{
  font-size:11px; font-weight:600; letter-spacing:.14em;
  color:var(--gold-bright); margin-right:4px;
}

/* =========================================================
   헤더
   ========================================================= */
.site-header{
  position:fixed; inset:0 0 auto 0; z-index:100; height:var(--hdr);
  transition:background .3s var(--ease), box-shadow .3s var(--ease);
  border-bottom:1px solid transparent;
}
.header-inner{ display:flex; align-items:center; justify-content:space-between; height:var(--hdr); }
.brand{ position:relative; display:block; height:52px; }
.brand img{ height:52px; width:auto; transition:opacity .3s var(--ease); }
.brand .brand-dark{ position:absolute; inset:0; opacity:0; }
.site-header.is-solid{
  background:rgba(250,246,237,.94);
  backdrop-filter:saturate(1.4) blur(10px);
  border-bottom-color:rgba(164,126,57,.28);
}
.site-header.is-solid .brand-light{ opacity:0; }
.site-header.is-solid .brand-dark{ opacity:1; }

.nav{ display:flex; align-items:center; gap:30px; }
.nav a{
  position:relative; font-size:15px; font-weight:500; color:rgba(250,246,237,.86);
  transition:color .2s var(--ease);
}
.nav a::after{
  content:''; position:absolute; left:0; right:100%; bottom:-6px; height:1px;
  background:var(--gold-bright); transition:right .3s var(--ease);
}
.nav a:hover{ color:var(--paper); }
.nav a:hover::after{ right:0; }
.nav .nav-cta{
  padding:10px 20px; border:1px solid rgba(228,211,174,.5); border-radius:2px;
  font-weight:600; color:var(--paper);
}
.nav .nav-cta::after{ display:none; }
.nav .nav-cta:hover{ background:var(--gold); border-color:var(--gold); }
.site-header.is-solid .nav a{ color:var(--navy); }
.site-header.is-solid .nav .nav-cta{ background:var(--navy); color:var(--paper); border-color:var(--navy); }
.site-header.is-solid .nav .nav-cta:hover{ background:var(--gold); border-color:var(--gold); }

.nav-toggle{
  display:none; width:44px; height:44px; background:none; border:0; cursor:pointer;
  flex-direction:column; justify-content:center; align-items:flex-end; gap:6px;
}
.nav-toggle span{
  display:block; width:24px; height:1.5px; background:var(--paper);
  transition:transform .3s var(--ease), opacity .2s var(--ease), width .3s var(--ease);
}
.site-header.is-solid .nav-toggle span{ background:var(--navy); }

/* =========================================================
   히어로
   ========================================================= */
.hero{
  position:relative; overflow:hidden; background:var(--navy-deep); color:var(--paper);
  padding:calc(var(--hdr) + 72px) 0 84px;
}
.hero::before{
  content:''; position:absolute; inset:0;
  background:radial-gradient(120% 90% at 18% 0%, #06305F 0%, var(--navy-deep) 62%);
}
.hero-compass{
  position:absolute; top:50%; right:-5%; width:min(900px,92vw); aspect-ratio:1;
  transform:translateY(-50%); color:var(--gold-bright); opacity:.2;
  animation:spin 120s linear infinite;
}
.hero-compass svg{ width:100%; height:100%; }
@keyframes spin{ to{ transform:translateY(-50%) rotate(360deg); } }

.hero-inner{
  position:relative; display:grid; grid-template-columns:1.08fr .92fr;
  gap:56px; align-items:center;
}
.hero-eyebrow{
  display:flex; align-items:center; font-size:13px; font-weight:600;
  letter-spacing:.12em; color:var(--gold-pale); margin-bottom:26px;
}
.hero-title{
  font-size:clamp(36px,4.6vw,56px); line-height:1.26; letter-spacing:-.035em;
  color:var(--paper);
}
.hero-title em{
  font-style:normal; position:relative; color:var(--gold-bright);
}
.hero-title em::after{
  content:''; position:absolute; left:0; right:0; bottom:.06em; height:1px;
  background:rgba(201,164,100,.55);
}
.hero-lede{
  max-width:37em; margin-top:28px; font-size:16.5px; line-height:1.95;
  color:rgba(250,246,237,.76);
}
.hero-actions{ display:flex; flex-wrap:wrap; gap:12px; margin-top:40px; }

.hero-portrait{ position:relative; margin:0; aspect-ratio:4/5; }
.hero-portrait::before{
  content:''; position:absolute; left:-16px; top:-16px; right:26px; bottom:26px;
  border:1px solid rgba(201,164,100,.42); pointer-events:none; z-index:2;
}
.hero-portrait img{
  width:100%; height:100%; object-fit:cover; object-position:50% 22%;
  filter:saturate(.9) contrast(1.03); position:relative; z-index:1;
}
.hero-portrait::after{
  content:''; position:absolute; inset:0; z-index:1; pointer-events:none;
  background:linear-gradient(to top, rgba(1,21,46,.92) 0%, rgba(1,21,46,0) 42%),
             linear-gradient(to right, rgba(1,21,46,.55) 0%, rgba(1,21,46,0) 34%);
}
.hero-portrait figcaption{
  position:absolute; left:24px; bottom:22px; z-index:3;
  font-size:14px; color:rgba(250,246,237,.8); letter-spacing:.02em;
}
.hero-portrait figcaption strong{
  font-family:var(--display); font-size:21px; color:var(--paper); margin-right:8px;
}

/* =========================================================
   기준선 스트립
   ========================================================= */
.bearing{ background:var(--navy); color:var(--paper); border-top:1px solid var(--navy-line); }
.bearing-grid{
  display:grid; grid-template-columns:repeat(4,1fr);
}
.bearing-item{
  padding:30px 26px 30px 0; position:relative;
}
.bearing-item + .bearing-item{ padding-left:34px; }
.bearing-item + .bearing-item::before{
  content:''; position:absolute; left:0; top:34px; width:14px; height:5px;
  background:var(--gold); clip-path:polygon(0 50%, 50% 18%, 100% 50%, 50% 82%);
}
.bearing-k{ display:block; font-size:15px; font-weight:600; color:var(--paper); }
.bearing-v{ display:block; font-size:13.5px; color:rgba(250,246,237,.58); margin-top:4px; }

/* =========================================================
   섹션 공통
   ========================================================= */
.section{ padding:110px 0; scroll-margin-top:var(--hdr); }
.sec-head{ max-width:760px; margin-bottom:56px; }
.eyebrow{
  display:flex; align-items:center; font-size:12.5px; font-weight:700;
  letter-spacing:.18em; color:var(--gold); margin-bottom:18px;
}
.eyebrow-light{ color:var(--gold-bright); }
.sec-title{ font-size:clamp(28px,3.4vw,42px); color:var(--navy); }
.sec-lede{ margin-top:18px; font-size:16px; color:var(--ink-mute); }

/* ---------- 사무소 소개 ---------- */
.section-about{ position:relative; }
.about-grid{ display:grid; grid-template-columns:1.05fr .95fr; gap:64px; }
.about-lede p{ font-size:17px; line-height:2.05; color:#33383F; }
.about-lede p + p{ margin-top:22px; }
.about-lede strong{ color:var(--navy); font-weight:600; }
.about-points li{
  padding:24px 0; border-top:1px solid rgba(1,31,68,.14);
}
.about-points li:last-child{ border-bottom:1px solid rgba(1,31,68,.14); }
.about-points h3{ font-size:19px; color:var(--navy); margin-bottom:8px; }
.about-points p{ font-size:15px; color:var(--ink-mute); line-height:1.85; }

/* 사무소 소개 — 상호 풀이 */
.about-note{
  display:flex; gap:20px; align-items:flex-start;
  margin-top:38px; padding-top:28px; border-top:1px solid rgba(1,31,68,.14);
}
.about-note img{ width:62px; flex:none; opacity:.92; }
.about-note dt{
  font-family:var(--display); font-size:19px; font-weight:700; color:var(--navy); margin-bottom:6px;
}
.about-note dd{ font-size:14.5px; line-height:1.85; color:var(--ink-mute); }

/* ---------- 업무분야 ---------- */
.section-services{ background:var(--paper-2); }
.cards{ display:grid; grid-template-columns:repeat(3,1fr); gap:20px; }
.card{
  background:var(--paper); border:1px solid rgba(1,31,68,.13); padding:38px 32px 34px;
  transition:border-color .3s var(--ease), transform .3s var(--ease), box-shadow .3s var(--ease);
}
.card:hover{
  border-color:var(--gold); transform:translateY(-4px);
  box-shadow:0 18px 40px -28px rgba(1,31,68,.55);
}
.card-title{
  font-size:23px; color:var(--navy); padding-bottom:16px; margin-bottom:16px;
  border-bottom:1px solid rgba(164,126,57,.35);
}
.card-desc{ font-size:14.5px; color:var(--ink-mute); line-height:1.85; min-height:3.7em; }
.card-list{ margin-top:20px; }
.card-list li{
  position:relative; padding-left:18px; font-size:14.5px; color:#3A4049; line-height:1.7;
}
.card-list li + li{ margin-top:9px; }
.card-list li::before{
  content:''; position:absolute; left:0; top:.72em; width:10px; height:4px;
  background:var(--gold); clip-path:polygon(0 50%, 50% 18%, 100% 50%, 50% 82%);
}

/* ---------- 상담 절차 ---------- */
.steps{
  display:grid; grid-template-columns:repeat(5,1fr); gap:0;
  border-top:1px solid rgba(164,126,57,.4);
}
.step{ position:relative; padding:34px 24px 0 0; }
.step::before{
  content:''; position:absolute; left:0; top:-4px; width:8px; height:8px;
  background:var(--gold); border-radius:50%;
}
.step + .step{ padding-left:24px; }
.step-no{
  display:block; font-family:var(--display); font-size:15px; font-weight:700;
  letter-spacing:.1em; color:var(--gold); margin-bottom:12px;
}
.step h3{ font-size:19px; color:var(--navy); margin-bottom:10px; }
.step p{ font-size:14.5px; color:var(--ink-mute); line-height:1.8; }

/* ---------- 대표세무사 ---------- */
.section-profile{ background:var(--navy); color:var(--paper); }
.profile-grid{ display:grid; grid-template-columns:.85fr 1.15fr; gap:64px; align-items:center; }
.profile-photo{ position:relative; margin:0; aspect-ratio:4/5; }
.profile-photo::before{
  content:''; position:absolute; left:18px; top:18px; right:-18px; bottom:-18px;
  border:1px solid rgba(201,164,100,.45);
}
.profile-photo img{
  position:relative; width:100%; height:100%; object-fit:cover; object-position:50% 18%;
  filter:saturate(.92);
}
.profile-name{ font-size:clamp(30px,3.6vw,42px); color:var(--paper); }
.profile-name span{ font-size:.5em; font-family:var(--body); font-weight:500; color:var(--gold-bright); margin-left:12px; }
.profile-quote{
  margin-top:24px; padding-left:22px; border-left:2px solid var(--gold);
  font-family:var(--display); font-size:19px; line-height:1.95; color:rgba(250,246,237,.9);
}
.profile-cv{ margin:34px 0 38px; }
.profile-cv li{
  display:grid; grid-template-columns:44px 1fr; gap:16px;
  padding:14px 0; border-bottom:1px solid rgba(228,211,174,.16); font-size:15px;
}
.cv-k{
  color:var(--gold-bright); font-family:var(--display); font-weight:700;
  font-size:16px; letter-spacing:.02em; padding-top:1px;
}
.cv-v{ color:rgba(250,246,237,.82); }

/* ---------- 상담 문의 ---------- */
.section-contact{ background:var(--paper-2); }
.contact-grid{ display:grid; grid-template-columns:1.25fr .75fr; gap:24px; align-items:start; }
.form{ background:var(--paper); border:1px solid rgba(1,31,68,.13); padding:40px; }
.field{ margin-bottom:20px; }
.field-row{ display:grid; grid-template-columns:1fr 1fr; gap:20px; }
.field label{
  display:block; font-size:13.5px; font-weight:600; color:var(--navy); margin-bottom:8px;
}
.field label em{ font-style:normal; font-weight:400; color:var(--ink-mute); }
.field input,.field select,.field textarea{
  width:100%; padding:14px 16px; font-family:inherit; font-size:15px; color:var(--ink);
  background:var(--white); border:1px solid rgba(1,31,68,.18); border-radius:2px;
  transition:border-color .2s var(--ease), box-shadow .2s var(--ease);
}
.field textarea{ resize:vertical; line-height:1.75; }
.field input:focus,.field select:focus,.field textarea:focus{
  outline:none; border-color:var(--gold); box-shadow:0 0 0 3px rgba(164,126,57,.14);
}
.field input::placeholder,.field textarea::placeholder{ color:#A9AFB9; }
.field-check{ display:flex; align-items:flex-start; gap:10px; margin:4px 0 24px; }
.field-check input{ width:17px; height:17px; margin-top:5px; accent-color:var(--gold); flex:none; }
.field-check label{ font-size:14px; color:var(--ink-mute); line-height:1.6; }
.field-check a{ color:var(--navy); text-decoration:underline; text-underline-offset:2px; }
.form-status{ margin-top:14px; font-size:14px; min-height:1.4em; line-height:1.7; }
.hp{ position:absolute !important; left:-9999px; width:1px; height:1px; opacity:0; }
.form-status.ok{ color:#1D6B45; }
.form-status.err{ color:#A3342C; }

.contact-info{ background:var(--navy); color:var(--paper); padding:40px 36px; }
.contact-info h3{
  font-size:21px; color:var(--paper); padding-bottom:18px; margin-bottom:6px;
  border-bottom:1px solid rgba(228,211,174,.2);
}
.info-list div{
  display:grid; grid-template-columns:78px 1fr; gap:12px; padding:16px 0;
  border-bottom:1px solid rgba(228,211,174,.12); font-size:15px;
}
.info-list dt{ color:var(--gold-bright); font-size:13.5px; font-weight:600; padding-top:2px; }
.info-list dd{ color:rgba(250,246,237,.9); }
.info-list a:hover{ color:var(--gold-bright); }
.info-list .dim{ color:rgba(250,246,237,.5); font-size:13.5px; }
.info-note{ margin-top:22px; font-size:13.5px; line-height:1.8; color:rgba(250,246,237,.6); }

/* ---------- 오시는 길 ---------- */
.loc-grid{
  display:grid; grid-template-columns:minmax(0,1.18fr) minmax(0,.82fr);
  gap:48px; align-items:start;
}
.loc-map{
  display:block; padding:14px 14px 0; background:var(--paper-2);
  border:1px solid rgba(1,31,68,.13);
  transition:border-color .25s var(--ease), box-shadow .25s var(--ease);
}
.loc-map:hover{ border-color:var(--gold); box-shadow:0 20px 44px -32px rgba(1,31,68,.6); }
.loc-map img{ width:100%; height:auto; border:1px solid rgba(1,31,68,.08); }
.loc-map-cta{
  display:flex; align-items:center; justify-content:center; gap:8px;
  padding:14px 0 16px; font-size:14px; font-weight:600; color:var(--navy);
}
.loc-map-cta::before{
  content:''; width:14px; height:5px; background:var(--gold);
  clip-path:polygon(0 50%, 50% 18%, 100% 50%, 50% 82%);
}
.loc-map:hover .loc-map-cta{ color:var(--gold); }

.loc-item + .loc-item{ margin-top:24px; }
.loc-item h3{ font-size:18px; color:var(--navy); margin-bottom:8px; }
.loc-item p{ font-size:15px; color:var(--ink-mute); line-height:1.85; }
.loc-item strong{ color:var(--navy); font-weight:600; }
.loc-item .dim{ color:#9AA0AB; font-size:13.5px; }

.loc-links{ display:flex; flex-wrap:wrap; gap:9px; margin-top:30px; }
.loc-links .btn{ padding:12px 20px; font-size:14px; }

/* =========================================================
   푸터
   ========================================================= */
.site-footer{ background:var(--navy-deep); color:rgba(250,246,237,.65); padding:64px 0 100px; }
.footer-inner{ display:grid; grid-template-columns:auto 1fr; gap:48px; align-items:start; }
.footer-brand img{ height:46px; width:auto; }
.footer-brand p{
  margin-top:10px; font-size:11px; letter-spacing:.2em; color:rgba(201,164,100,.75);
}
.footer-meta p{ font-size:13.5px; line-height:1.9; }
.footer-links{ margin-top:12px; }
.footer-links a{ color:var(--gold-bright); }
.footer-links a:hover{ text-decoration:underline; }
.footer-copy{ margin-top:16px; color:rgba(250,246,237,.35); font-size:12.5px; }

/* =========================================================
   모바일 하단 바
   ========================================================= */
.mobile-bar{ display:none; }

/* =========================================================
   등장 애니메이션
   ========================================================= */
.reveal{ opacity:0; transform:translateY(22px); }
.reveal.is-in{
  opacity:1; transform:none;
  transition:opacity .7s var(--ease), transform .7s var(--ease);
}

/* =========================================================
   반응형
   ========================================================= */
@media (max-width:1024px){
  .hero-inner{ grid-template-columns:1fr; gap:44px; }
  .hero-portrait{ max-width:420px; }
  .about-grid,.profile-grid,.contact-grid{ grid-template-columns:1fr; gap:40px; }
  .loc-grid{ grid-template-columns:1fr; gap:36px; }
  .cards{ grid-template-columns:repeat(2,1fr); }
  .steps{ grid-template-columns:repeat(2,1fr); gap:0 24px; }
  .step{ padding-right:0; border-top:1px solid rgba(164,126,57,.25); margin-top:-1px; }
  .step + .step{ padding-left:0; }
  .steps{ border-top:0; }
  .bearing-grid{ grid-template-columns:repeat(2,1fr); }
  .bearing-item{ padding:22px 20px 22px 0; }
  .bearing-item:nth-child(2n){ padding-left:26px; }
  .bearing-item:nth-child(2n+1)::before{ display:none; }
  .profile-photo{ max-width:400px; }
  .profile-photo::before{ right:0; }
}

@media (max-width:820px){
  :root{ --hdr:72px; }
  .brand,.brand img{ height:40px; }
  .nav{
    position:fixed; inset:var(--hdr) 0 auto 0; flex-direction:column; align-items:stretch;
    gap:0; background:var(--navy); padding:8px 0 20px;
    transform:translateY(-140%); transition:transform .38s var(--ease);
    box-shadow:0 20px 40px -24px rgba(0,0,0,.6);
  }
  .nav.is-open{ transform:none; }
  .nav a{ padding:15px 24px; color:rgba(250,246,237,.9); border-bottom:1px solid rgba(228,211,174,.1); }
  .nav a::after{ display:none; }
  .nav .nav-cta{ margin:16px 24px 0; text-align:center; border-color:var(--gold); background:var(--gold); }
  .nav-toggle{ display:flex; }
  .nav-toggle.is-open span:nth-child(1){ transform:translateY(7.5px) rotate(45deg); }
  .nav-toggle.is-open span:nth-child(2){ opacity:0; width:0; }
  .nav-toggle.is-open span:nth-child(3){ transform:translateY(-7.5px) rotate(-45deg); }
  .site-header.is-solid .nav a{ color:rgba(250,246,237,.9); }

  .hero{ padding:calc(var(--hdr) + 52px) 0 64px; }
  .hero-compass{ right:-32%; opacity:.12; }
  .hero-lede{ font-size:15.5px; line-height:1.9; }
  .hero-actions .btn{ flex:1 1 auto; }
  .section{ padding:76px 0; }
  .sec-head{ margin-bottom:40px; }
  .cards{ grid-template-columns:1fr; }
  .loc-grid{ gap:30px; }
  .loc-links{ margin-top:26px; }
  .loc-links .btn{ flex:1 1 auto; }
  .card{ padding:30px 26px; }
  .card-desc{ min-height:0; }
  .form{ padding:28px 22px; }
  .field-row{ grid-template-columns:1fr; gap:0; }
  .field-row .field{ margin-bottom:20px; }
  .contact-info{ padding:32px 24px; }
  .footer-inner{ grid-template-columns:1fr; gap:28px; }
  .site-footer{ padding:52px 0 110px; }

  .mobile-bar{
    position:fixed; left:0; right:0; bottom:0; z-index:120; display:grid;
    grid-template-columns:1fr 1fr 1.3fr; background:var(--navy);
    border-top:1px solid var(--navy-line);
    padding-bottom:env(safe-area-inset-bottom);
  }
  .mobile-bar a{
    padding:16px 8px; text-align:center; font-size:14px; font-weight:600;
    color:rgba(250,246,237,.86); border-right:1px solid rgba(228,211,174,.14);
  }
  .mobile-bar a:last-child{ border-right:0; }
  .mobile-bar .mb-primary{ background:var(--gold); color:#fff; }
}

@media (max-width:520px){
  .wrap{ padding:0 18px; }
  .bearing-grid{ grid-template-columns:1fr; }
  .bearing-item{ padding:16px 0 !important; border-bottom:1px solid rgba(228,211,174,.12); }
  .bearing-item::before{ display:none !important; }
  .steps{ grid-template-columns:1fr; }
  .hero-portrait::before{ right:16px; bottom:16px; }
  .profile-cv li{ grid-template-columns:1fr; gap:2px; }
}

@media (prefers-reduced-motion:reduce){
  html{ scroll-behavior:auto; }
  *,*::before,*::after{ animation-duration:.001ms !important; animation-iteration-count:1 !important;
                        transition-duration:.001ms !important; }
  .reveal{ opacity:1; transform:none; }
}

@media print{
  .site-header,.mobile-bar,.hero-compass{ display:none; }
  body{ background:#fff; }
}

/* =========================================================
   내부 페이지 (개인정보처리방침 등)
   ========================================================= */
.page-header{
  background:var(--navy); color:var(--paper);
  padding:calc(var(--hdr) + 72px) 0 60px;
}
.page-header .sec-title{ color:var(--paper); }
.page-header .eyebrow{ color:var(--gold-bright); }
.legal{ padding:72px 0 110px; }
.legal-body{ max-width:820px; }
.legal-body h2{
  font-size:22px; color:var(--navy); margin:44px 0 14px;
  padding-bottom:12px; border-bottom:1px solid rgba(164,126,57,.35);
}
.legal-body h2:first-child{ margin-top:0; }
.legal-body p{ font-size:15.5px; line-height:1.95; color:#3A4049; margin-bottom:12px; }
.legal-body ul{ margin:8px 0 16px; }
.legal-body ul li{
  position:relative; padding-left:18px; font-size:15px; line-height:1.9; color:#3A4049;
}
.legal-body ul li::before{
  content:''; position:absolute; left:0; top:.82em; width:10px; height:4px;
  background:var(--gold); clip-path:polygon(0 50%, 50% 18%, 100% 50%, 50% 82%);
}
.legal-body table{ width:100%; border-collapse:collapse; margin:12px 0 18px; font-size:14.5px; }
.legal-body th,.legal-body td{
  border:1px solid rgba(1,31,68,.14); padding:12px 14px; text-align:left; vertical-align:top;
}
.legal-body th{ background:var(--paper-2); color:var(--navy); font-weight:600; }
.legal-note{ margin-top:36px; font-size:14px; color:var(--ink-mute); }
